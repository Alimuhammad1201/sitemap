<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>TriA Tech Solutions Website &mdash; Site Map</title>
<style>
:root{
  --paper:#F4F6F8; --surface:#FFFFFF; --surface-2:#EAEEF3;
  --ink:#121820; --ink-2:#4A5563; --ink-3:#78828F;
  --rule:#D6DDE4; --rule-2:#B4BFCA; --accent:#C33A22;
  --l-company:#4C5A6B; --l-services:#1A6EA8; --l-solutions:#0E7D6E;
  --l-industries:#8A6A1C; --l-hire:#8A3B66; --l-content:#B05524; --l-legal:#6A7280;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1116; --surface:#161C24; --surface-2:#1C232D;
    --ink:#E7ECF2; --ink-2:#A6B1BF; --ink-3:#7D8895;
    --rule:#28303B; --rule-2:#3C4654; --accent:#FF8160;
    --l-company:#97A6B8; --l-services:#5CB0EA; --l-solutions:#3FC6B0;
    --l-industries:#D6AE52; --l-hire:#DD83B7; --l-content:#F2935D; --l-legal:#9AA5B3;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1116; --surface:#161C24; --surface-2:#1C232D;
  --ink:#E7ECF2; --ink-2:#A6B1BF; --ink-3:#7D8895;
  --rule:#28303B; --rule-2:#3C4654; --accent:#FF8160;
  --l-company:#97A6B8; --l-services:#5CB0EA; --l-solutions:#3FC6B0;
  --l-industries:#D6AE52; --l-hire:#DD83B7; --l-content:#F2935D; --l-legal:#9AA5B3;
}

*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased}
.wrap{max-width:1280px; margin:0 auto; padding:clamp(22px,4vw,44px) clamp(14px,3vw,32px) 64px}

header{display:flex; flex-direction:column; gap:12px; padding-bottom:20px; border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.17em; text-transform:uppercase; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:5px 13px}
h1{font-family:var(--mono); font-size:clamp(24px,3.6vw,36px); line-height:1.1; letter-spacing:-.035em; font-weight:600; margin:0; text-wrap:balance}
.sub{font-size:15.5px; color:var(--ink-2); margin:0; max-width:66ch; line-height:1.55}

.bar{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; margin:20px 0 14px}
.keys{display:flex; flex-wrap:wrap; gap:7px 18px; align-items:center; font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
.key{display:flex; align-items:center; gap:7px}
.key i{display:block; width:11px; height:11px; border-radius:50%; flex:none; border:2px solid var(--ink-2); background:var(--ink-2)}
.key i.k2{background:var(--surface); border-width:3px}
.key i.k3{background:var(--surface); border-width:1.5px; width:9px; height:9px}
.key u{display:block; width:16px; height:11px; border:1.5px dashed var(--ink-3); border-radius:2px; text-decoration:none}
.key s{display:block; width:16px; height:11px; border:1.5px solid var(--ink-2); border-radius:2px; text-decoration:none}

.filters{display:flex; flex-wrap:wrap; gap:5px}
.filters button{font-family:var(--mono); font-size:11.5px; background:var(--surface); color:var(--ink-2); border:1px solid var(--rule); border-radius:3px; padding:6px 12px; cursor:pointer}
.filters button:hover{border-color:var(--rule-2); color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.filters button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}

.canvas{background:var(--surface); border:1px solid var(--rule); border-radius:4px; overflow-x:auto; padding:8px 4px}
svg{display:block; min-width:1040px; width:100%; height:auto}
text{font-family:var(--mono)}
.t-ink{fill:var(--ink)} .t-mut{fill:var(--ink-3)} .t-dim{fill:var(--ink-2)}
.hollow{fill:var(--surface)}
.col-rule{stroke:var(--rule)}
.band{fill:var(--surface-2)}
.row{transition:opacity .18s ease}
[data-f="1"] .row:not(.sec):not([data-p="1"]),
[data-f="2"] .row:not(.sec):not([data-p="2"]),
[data-f="3"] .row:not(.sec):not([data-p="3"]){opacity:.16}

figcaption{font-size:13px; color:var(--ink-3); margin-top:12px; line-height:1.5; max-width:80ch}
figure{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media print{.filters{display:none} body{background:#fff}}
</style>

<div class="wrap">
<header>
  <h1>TriA Tech Solution Website Site Map</h1>
  <p class="sub">All 108 pages in one tree. Every service category and every service page underneath it. Numbers are page references &mdash; quote them when you want something removed, renamed or added.</p>
</header>

<figure>
  <div class="canvas" id="canvas"></div>
</figure>
</div>

<script>
const MAP = [
{k:"company", name:"Company", url:null, kids:[
  {n:"Home", u:"/", p:1},
  {n:"About Us", u:"/about", p:1, c:[
    {n:"Our Team", u:"/about/team", p:2},
    {n:"Our Process", u:"/about/process", p:2},
    {n:"Careers", u:"/about/careers", p:2}]},
  {n:"Portfolio", u:"/portfolio", p:1},
  {n:"Case Studies", u:"/case-studies", p:2},
  {n:"Testimonials", u:"/testimonials", p:3},
  {n:"Technologies", u:"/technologies", p:3},
  {n:"Contact Us", u:"/contact", p:1}
]},
{k:"services", name:"Services", url:"/services", p:1, kids:[
  {n:"Software Development", u:"/software-development", p:1, c:[
    {n:"Custom Software Development", u:"/custom-software", p:2},
    {n:"Web Application Development", u:"/web-application-development", p:2},
    {n:"SaaS Development", u:"/saas-development", p:2},
    {n:"API Development & Integration", u:"/api-development-integration", p:3},
    {n:"CRM & ERP Development", u:"/crm-erp-development", p:2},
    {n:"POS System Development", u:"/pos-systems", p:3},
    {n:"Software Maintenance & Support", u:"/software-maintenance-support", p:3},
    {n:"Dedicated Development Team", u:"/dedicated-development-team", p:2}]},
  {n:"Mobile App Development", u:"/mobile-app-development", p:1, c:[
    {n:"Android App Development", u:"/android-app-development", p:2},
    {n:"iOS App Development", u:"/ios-app-development", p:2},
    {n:"Cross-Platform App Development", u:"/cross-platform-app-development", p:2},
    {n:"Progressive Web Apps (PWA)", u:"/progressive-web-apps", p:3},
    {n:"IoT Solutions", u:"/iot-solutions", p:3}]},
  {n:"E-Commerce Development", u:"/ecommerce-development", p:1, c:[
    {n:"Shopify Development", u:"/shopify-development", p:2},
    {n:"Shopify Store Setup & Customization", u:"/shopify-store-setup", p:2},
    {n:"Shopify Theme Development", u:"/shopify-theme-development", p:3},
    {n:"Shopify App Integration", u:"/shopify-app-integration", p:3},
    {n:"Shopify Support & Maintenance", u:"/shopify-support-maintenance", p:3},
    {n:"WooCommerce Development", u:"/woocommerce-development", p:2},
    {n:"Dropshipping Store Development", u:"/dropshipping-store-development", p:2},
    {n:"Payment Gateway Integration", u:"/payment-gateway-integration", p:3},
    {n:"Shipping & Logistics Integration", u:"/shipping-logistics-integration", p:3},
    {n:"E-Commerce Store Management", u:"/store-management", p:3}]},
  {n:"WordPress Development", u:"/wordpress-development", p:1, c:[
    {n:"WordPress Theme & Plugin Development", u:"/theme-plugin-development", p:2},
    {n:"WordPress Support & Maintenance", u:"/support-maintenance", p:3}]},
  {n:"UI/UX & Design", u:"/ui-ux-design", p:1, c:[
    {n:"Website Design", u:"/website-design", p:2},
    {n:"Graphic Design", u:"/graphic-design", p:3},
    {n:"Branding & Identity", u:"/branding-identity", p:2}]},
  {n:"Digital Marketing", u:"/digital-marketing", p:1, c:[
    {n:"SEO Services", u:"/seo-services", p:2},
    {n:"Google Ads / PPC", u:"/google-ads-ppc", p:2},
    {n:"Social Media Marketing", u:"/social-media-marketing", p:2},
    {n:"Content Marketing", u:"/content-marketing", p:3},
    {n:"Email Marketing", u:"/email-marketing", p:3},
    {n:"Conversion Rate Optimization", u:"/conversion-rate-optimization", p:3}]},
  {n:"Cloud & DevOps", u:"/cloud-devops", p:1, c:[
    {n:"Cloud Migration", u:"/cloud-migration", p:3},
    {n:"AWS / Azure / Google Cloud", u:"/aws-azure-google-cloud", p:3},
    {n:"DevOps & CI/CD", u:"/devops-ci-cd", p:2},
    {n:"Server Management", u:"/server-management", p:3},
    {n:"Hosting & VPS", u:"/hosting-vps", p:3},
    {n:"Backup & Disaster Recovery", u:"/backup-disaster-recovery", p:3},
    {n:"Infrastructure Monitoring", u:"/infrastructure-monitoring", p:3}]},
  {n:"AI & Automation", u:"/ai-automation", p:1, c:[
    {n:"AI Application Development", u:"/ai-application-development", p:3},
    {n:"AI Chatbot Development", u:"/ai-chatbot-development", p:2},
    {n:"WhatsApp Business Solutions", u:"/whatsapp-business-solutions", p:3},
    {n:"Workflow Automation", u:"/workflow-automation", p:3},
    {n:"Business Process Automation", u:"/business-process-automation", p:3},
    {n:"Third-Party Integrations", u:"/third-party-integrations", p:3}]},
  {n:"IT Consulting & Support", u:"/it-consulting", p:1, c:[
    {n:"Digital Transformation", u:"/digital-transformation", p:3},
    {n:"Software Architecture", u:"/software-architecture", p:3},
    {n:"IT Support & Maintenance", u:"/it-support-maintenance", p:3}]}
]},
{k:"solutions", name:"Solutions", url:"/solutions", p:1, kids:[
  {n:"ERP System", u:"/erp-system", p:1},
  {n:"CRM System", u:"/crm-system", p:1},
  {n:"HR & Payroll System", u:"/hr-payroll-system", p:2},
  {n:"Inventory Management System", u:"/inventory-management-system", p:2},
  {n:"Accounting Software", u:"/accounting-software", p:2},
  {n:"School Management System", u:"/school-management-system", p:1},
  {n:"Hospital Management System", u:"/hospital-management-system", p:2},
  {n:"Booking & Reservation System", u:"/booking-reservation-system", p:2},
  {n:"Fleet Management System", u:"/fleet-management-system", p:2},
  {n:"Project Management System", u:"/project-management-system", p:2},
  {n:"POS System", u:"/pos-system", p:1}
]},
{k:"industries", name:"Industries", url:"/industries", p:2, kids:[
  {n:"Healthcare", u:"/healthcare", p:3},
  {n:"Education", u:"/education", p:3},
  {n:"Retail & E-Commerce", u:"/retail-ecommerce", p:3},
  {n:"Logistics & Transport", u:"/logistics-transport", p:3},
  {n:"Real Estate", u:"/real-estate", p:3},
  {n:"Manufacturing", u:"/manufacturing", p:3},
  {n:"Finance & Fintech", u:"/finance-fintech", p:3}
]},
{k:"content", name:"Blog & Content", url:"/blog", p:1, kids:[
  {n:"Blog Category", u:"/blog/category/[slug]", p:2},
  {n:"Blog Post", u:"/blog/[slug]", p:2},
  {n:"Resources & Guides", u:"/resources", p:3}
]},
{k:"legal", name:"Utility & Legal", url:null, kids:[
  {n:"FAQ", u:"/faq", p:1},
  {n:"Privacy Policy", u:"/privacy-policy", p:1},
  {n:"Terms & Conditions", u:"/terms", p:1},
  {n:"Refund Policy", u:"/refund-policy", p:2},
]}
];

/* ---------- geometry ---------- */
const ROW=20, GAP=32, TOP=36;
const RX=36,  RW=112;          // root box      36..148
const SX=212, SW=178;          // section box  212..390
const CX=446, CW=266;          // category box 446..712
const DX=768;                  // service page dot
const VW=1090;

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pad = i => String(i).padStart(3,"0");

function dot(x,cy,p){
  if(p===1) return '<circle cx="'+x+'" cy="'+cy+'" r="4.5" fill="currentColor"/>';
  if(p===2) return '<circle cx="'+x+'" cy="'+cy+'" r="4.3" class="hollow" stroke="currentColor" stroke-width="2.6"/>';
  return '<circle cx="'+x+'" cy="'+cy+'" r="3.6" class="hollow" stroke="currentColor" stroke-width="1.4"/>';
}
function elbow(x1,y1,x2,y2,w){
  const m = x1 + Math.round((x2-x1)/2);
  return '<path d="M'+x1+' '+y1+' H'+m+' V'+y2+' H'+x2+'" fill="none" stroke="currentColor" stroke-width="'+(w||1.2)+'" opacity=".5"/>';
}

let num=0, y=TOP;
const groups=[], bands=[], anchors=[];

MAP.forEach(function(S,si){
  if(si) y += GAP;
  const bandTop = y - 12;
  const parts = [];
  const secNum = S.url ? (++num) : null;
  const kidY = [];

  S.kids.forEach(function(K){
    const kNum = ++num;
    const hasKids = !!(K.c && K.c.length);

    if(hasKids){
      const gY = [];
      K.c.forEach(function(G){
        const gNum = ++num;
        const cy = y + ROW/2;
        parts.push('<g class="row" data-p="'+G.p+'">' +
          dot(DX,cy,G.p) +
          '<text x="'+(DX+13)+'" y="'+(cy+3.4)+'" class="t-mut" font-size="9.5">'+pad(gNum)+'</text>' +
          '<text x="'+(DX+42)+'" y="'+(cy+3.8)+'" class="t-ink" font-size="11">'+esc(G.n)+'</text>' +
          '</g>');
        gY.push(cy);
        y += ROW;
      });
      const ky = (gY[0] + gY[gY.length-1]) / 2;
      gY.forEach(function(gy){ parts.push(elbow(CX+CW, ky, DX-7, gy)); });
      parts.push('<g class="row" data-p="'+K.p+'">' +
        '<rect x="'+CX+'" y="'+(ky-12)+'" width="'+CW+'" height="24" rx="3" fill="currentColor" opacity=".11"/>' +
        '<rect x="'+CX+'" y="'+(ky-12)+'" width="'+CW+'" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>' +
        '<text x="'+(CX+10)+'" y="'+(ky+3.4)+'" class="t-mut" font-size="9.5">'+pad(kNum)+'</text>' +
        '<text x="'+(CX+38)+'" y="'+(ky+4)+'" class="t-ink" font-size="11.5" font-weight="600">'+esc(K.n)+'</text>' +
        '<text x="'+(CX+CW-8)+'" y="'+(ky+3.4)+'" class="t-mut" font-size="9" text-anchor="end">'+K.c.length+'</text>' +
        '</g>');
      kidY.push(ky);
    }else{
      const ky = y + ROW/2;
      parts.push('<g class="row" data-p="'+K.p+'">' +
        dot(CX+6,ky,K.p) +
        '<text x="'+(CX+19)+'" y="'+(ky+3.4)+'" class="t-mut" font-size="9.5">'+pad(kNum)+'</text>' +
        '<text x="'+(CX+48)+'" y="'+(ky+3.9)+'" class="t-ink" font-size="11.5">'+esc(K.n)+'</text>' +
        '</g>');
      kidY.push(ky);
      y += ROW;
    }
  });

  const sy = Math.round((kidY[0] + kidY[kidY.length-1]) / 2);
  const total = S.kids.reduce(function(a,K){ return a + 1 + (K.c ? K.c.length : 0); },0) + (S.url?1:0);

  kidY.forEach(function(ky){ parts.push(elbow(SX+SW, sy, CX-2, ky)); });
  parts.push('<g class="row sec"'+(S.p?' data-p="'+S.p+'"':'')+'>' +
    '<rect x="'+SX+'" y="'+(sy-20)+'" width="'+SW+'" height="40" rx="3" fill="currentColor" opacity="'+(S.url?'.15':'.06')+'"/>' +
    '<rect x="'+SX+'" y="'+(sy-20)+'" width="'+SW+'" height="40" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"'+(S.url?'':' stroke-dasharray="4 3"')+'/>' +
    (secNum ? '<text x="'+(SX+13)+'" y="'+(sy-4)+'" class="t-mut" font-size="9.5">'+pad(secNum)+'</text>' : '') +
    '<text x="'+(SX+(secNum?41:13))+'" y="'+(sy-3)+'" class="t-ink" font-size="13" font-weight="600">'+esc(S.name)+'</text>' +
    '<text x="'+(SX+13)+'" y="'+(sy+13)+'" class="t-dim" font-size="9.5">'+(S.url ? esc(S.url) : 'nav group')+'   '+total+' pages</text>' +
    '</g>');

  bands.push({top:bandTop, bot:y+10, odd:si%2===1});
  anchors.push({y:sy, k:S.k});
  groups.push('<g style="color:var(--l-'+S.k+')">'+parts.join("")+'</g>');
});

const H = y + 26;
const rootY = Math.round((anchors[0].y + anchors[anchors.length-1].y)/2);

const bandSvg = bands.filter(function(b){return b.odd;}).map(function(b){
  return '<rect x="0" y="'+b.top+'" width="'+VW+'" height="'+(b.bot-b.top)+'" class="band" opacity=".5" rx="4"/>';
}).join("");

const spokes = anchors.map(function(a){
  return '<g style="color:var(--l-'+a.k+')">'+elbow(RX+RW, rootY, SX-2, a.y, 1.6)+'</g>';
}).join("");

const headings =
  '<text x="'+(RX+RW/2)+'" y="20" class="t-mut" font-size="9.5" letter-spacing=".14em" text-anchor="middle"></text>' ;
  
const root =
  '<rect x="'+RX+'" y="'+(rootY-21)+'" width="'+RW+'" height="42" rx="3" class="hollow" stroke="currentColor" stroke-width="1.6" opacity=".9"/>' +
  '<text x="'+(RX+RW/2)+'" y="'+(rootY-3)+'" class="t-ink" font-size="12.5" font-weight="600" text-anchor="middle">Site root</text>' +
  '<text x="'+(RX+RW/2)+'" y="'+(rootY+13)+'" class="t-mut" font-size="9.5" text-anchor="middle">108 pages</text>';

document.getElementById("canvas").innerHTML =
  '<svg viewBox="0 0 '+VW+' '+H+'" role="img" aria-label="Site map tree. The site root branches into seven sections: Company, Services, Solutions, Industries, Hire Developers, Blog and Content, and Utility and Legal. Services branches into nine service categories, each holding its own individual service pages. One hundred and eight pages in total, none more than three clicks from the home page.">' +
    bandSvg + headings + spokes + root + groups.join("") +
  '</svg>';

const buttons = Array.prototype.slice.call(document.querySelectorAll(".filters button"));
buttons.forEach(function(b){
  b.addEventListener("click", function(){
    buttons.forEach(function(x){ x.setAttribute("aria-pressed", String(x===b)); });
    const f=b.dataset.f;
    if(f==="all") document.body.removeAttribute("data-f"); else document.body.setAttribute("data-f",f);
  });
});
</script>

</body></html>
